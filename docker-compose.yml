services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aural
      POSTGRES_PASSWORD: aural
      POSTGRES_DB: aural
    ports:
      - "5432:5432"
    volumes:
      - aural_pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aural -d aural"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aural_pgdata:
